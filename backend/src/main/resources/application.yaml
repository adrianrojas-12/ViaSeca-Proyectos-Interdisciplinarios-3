server:
  port: ${PORT:8080}

spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/viaseca}
    username: ${DB_USER:viaseca}
    password: ${DB_PASSWORD:viaseca}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

app:
  jwt:
    secret: ${JWT_SECRET:cambia-este-secreto-por-uno-largo-y-aleatorio-123456}
    expiracion-minutos: 1440
  reportes:
    consenso-minimo: 3
    max-por-hora: 5
    duracion-horas: ${DURACION_HORAS:2}
    precision-maxima-metros: 100
    radio-voto-metros: ${RADIO_VOTO_METROS:500}
  reputacion:
    suspension: -5
  clima:
    url: https://api.open-meteo.com/v1/forecast
    umbral-mm: 0.1
    vigilancia-probabilidad: ${CLIMA_VIGILANCIA_PROBABILIDAD:30}
    vigilancia-mm-dia: 0.5
    precaucion-probabilidad: 60
    precaucion-mm-hora: 2.5
    precaucion-mm-dia: ${CLIMA_PRECAUCION_MM_DIA:5}
    alerta-mm-hora: 7.6
    alerta-mm-dia: ${CLIMA_ALERTA_MM_DIA:20}
  ors:
    url: https://api.openrouteservice.org
    api-key: ${ORS_API_KEY:}
    radio-evitar-metros: 60
  fotos:
    carpeta: ${FOTOS_CARPETA:./uploads}
  cors:
    origenes: ${CORS_ORIGENES:*}